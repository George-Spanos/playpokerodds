# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Web Api - build latest
on:
  push:
    branches:
      - "main"
    paths:
      - "src/web-api/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: "ubuntu-24.04"
    env:
      JWT_SECRET: SOMEJWTSECRET
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/web-api"

      - name: Start Postgres
        run: |
          docker run -d --name ppo-test-db -p 5432:5432 \
            -e POSTGRES_USER=root -e POSTGRES_PASSWORD=root -e POSTGRES_DB=gtop \
            postgres:15.1
          for i in $(seq 1 30); do
            docker exec ppo-test-db pg_isready -d gtop -U root && break
            sleep 1
          done

      - name: Test api
        working-directory: ./src/web-api
        env:
          TEST_DATABASE_URL: postgres://root:root@localhost:5432/gtop
          JWT_SECRET: SOMEJWTSECRET
        run: cargo test --release -- --test-threads=1

  build:
    runs-on: "ubuntu-24.04"
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/george-spanos/ppo-api:latest, ghcr.io/george-spanos/ppo-api:stable, ghcr.io/george-spanos/ppo-api:${{ github.sha }}
          context: ./src/web-api
          file: ./src/web-api/Dockerfile.rust
