name: Client UI - build and test

on:
  push:
    branches:
      - "main"
    paths:
      - "src/ui/**"
  workflow_dispatch:

jobs:
  ui:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        working-directory: ./src/ui
        run: npm ci

      - name: Unit tests
        working-directory: ./src/ui
        run: npm test

      - name: Build static bundle
        working-directory: ./src/ui
        run: npm run build

      - name: Publish image
        if: github.ref == 'refs/heads/main'
        run: echo "image publication handled by the compose/publish pipeline"
