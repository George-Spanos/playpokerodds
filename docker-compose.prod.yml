services:
  client-ui:
    restart: always
    image: ghcr.io/moby-it/ppo-ui:latest
    ports:
      - 43001:80
    depends_on:
      - web-api

  migrate:
    build:
      context: src/web-api
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - src/web-api/.env
    depends_on:
      db:
        condition: service_healthy

  web-api:
    restart: always
    image: ghcr.io/moby-it/ppo-api:latest
    ports:
      - 43002:3000
    env_file:
      - src/web-api/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      calc-odds-api:
        condition: service_started
  calc-odds-api:
    restart: always
    image: ghcr.io/moby-it/ppo-calc-odds:latest
    env_file: src/calc-odds-api/.env
    ports:
      - 43003:7071
    depends_on:
      - db

  db:
    restart: always
    image: postgres:16.3
    env_file: db.env
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "gtop", "-U", "postgres"]
      start_period: 10s
      interval: 3s
      timeout: 5s
      retries: 5
    ports:
      - "43004:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
    external: true