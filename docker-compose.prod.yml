services:
  client-ui:
    restart: always
    image: ghcr.io/george-spanos/ppo-ui:stable
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "127.0.0.1:43001:80"
      - "[::1]:43001:80"
    depends_on:
      - web-api

  web-api:
    restart: always
    image: ghcr.io/george-spanos/ppo-api:stable
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "127.0.0.1:43002:3000"
      - "[::1]:43002:3000"
    env_file:
      - src/web-api/.env
    depends_on:
      db:
        condition: service_healthy

  db:
    restart: always
    image: postgres:16.3
    env_file: db.env
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "gtop", "-U", "postgres"]
      start_period: 10s
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
    external: true
