services:
  client-ui:
    restart: always
    image: ghcr.io/george-spanos/ppo-ui:stable
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "127.0.0.1:43001:80"
      - "[::1]:43001:80"
    depends_on:
      - web-api

  migrate:
    build:
      context: src/web-api
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - src/web-api/.env
    depends_on:
      db:
        condition: service_healthy

  web-api:
    restart: always
    image: ghcr.io/george-spanos/ppo-api:stable
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "127.0.0.1:43002:3000"
      - "[::1]:43002:3000"
    env_file:
      - src/web-api/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      calc-odds-api:
        condition: service_started
  calc-odds-api:
    restart: always
    image: ghcr.io/george-spanos/ppo-calc-odds:stable
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file: src/calc-odds-api/.env
    ports:
      - "127.0.0.1:43003:7071"
      - "[::1]:43003:7071"
    depends_on:
      - db

  db:
    restart: always
    image: postgres:16.3
    env_file: db.env
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "gtop", "-U", "postgres"]
      start_period: 10s
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
    external: true
