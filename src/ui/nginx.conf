server {
    listen 80;
    listen [::]:80;
    server_name playpokerodds.com;
    root /usr/share/nginx/html;
    index index.html;

    # security headers (SEO trust signals)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # crawl directives
    location = /robots.txt {
        expires 1d;
    }
    location = /sitemap.xml {
        expires 1d;
    }

    # API routes proxy to the web-api container (compose network DNS).
    # The client fetches relative paths; POST/PUT must reach axum, not the
    # SPA fallback (which 405s non-GET on missing files).
    location ~ ^/(poker|auth|user|health)(/|$) {
        proxy_pass http://web-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # long-cache static assets (app code + card faces)
    location /src/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
