# Main nginx config for the non-root UI container (security audit finding H1).
# The stock image writes its pid and temp files under /var/run and /var/cache,
# which are root-owned, so everything mutable is moved under /tmp. Port 80 still
# binds because Docker sets net.ipv4.ip_unprivileged_port_start=0 in the
# container's network namespace.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include /etc/nginx/conf.d/*.conf;
}
