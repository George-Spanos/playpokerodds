services:
  client-ui:
    ports:
      - 4200:80
    build:
      context: src/ui
      dockerfile: Dockerfile
    depends_on:
      - web-api
  migrate:
    profiles: ['legacy']  # schema now baselined by the Rust API's migration runner
    build:
      context: src/web-api
      dockerfile: Dockerfile
    command: ['npx', 'prisma', 'migrate', 'deploy']
    env_file:
      - src/web-api/.env.docker
    depends_on:
      db:
        condition: service_healthy
  web-api:
    ports:
      - 3000:3000
    build:
      context: src/web-api
      dockerfile: Dockerfile.rust
    environment:
      - DB_CONNECTION_STRING=postgresql://root:root@db:5432/gtop
      - JWT_SECRET=SOME_SECRET_JWT_STUFF
      - CALC_ODDS_URL=http://calc-odds-api:7071/api/calcOdds
      - CALC_ODDS_KEY=somekey
      - LEADERBOARD_MIN_GAMES=2
    depends_on:
      db:
        condition: service_healthy
      calc-odds-api:
        condition: service_started
  calc-odds-api:
    build:
      context: src
      dockerfile: calc-odds-api/Dockerfile
    environment:
      - ITERATIONS=50000
    ports:
      - 7071:7071
    depends_on:
      - db
  db:
    image: postgres:16.3
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: gtop
    healthcheck:
      test: ['CMD', 'pg_isready', '-d', 'gtop', '-U', 'root']
      start_period: 10s
      interval: 3s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
